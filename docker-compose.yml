version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shafaq_postgres
    environment:
      POSTGRES_USER: shafaq
      POSTGRES_PASSWORD: shafaqpassword
      POSTGRES_DB: shafaq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shafaq -d shafaq"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: shafaq_server
    environment:
      DATABASE_URL: postgresql://shafaq:shafaqpassword@postgres:5432/shafaq?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
